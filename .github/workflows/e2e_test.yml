name: E2E Tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read
  checks: write
  id-token: write

jobs:
  test:
    runs-on: ubuntu-latest
    # Playwright's chromium needs apt-installable system libraries, so this
    # job runs on the bare runner instead of the Alpine build-image the other
    # suites share, and provisions its own JVM/Node/Clojure toolchain below.
    steps:
      - uses: actions/checkout@v6

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"

      # cli needs the JVM installed above; bb does not, but both are
      # provisioned from this one action.
      - name: Set up Clojure tools
        uses: DeLaGuardo/setup-clojure@13.6.1
        with:
          cli: "1.12.4.1629"
          bb: "1.12.218"

      - name: Cache dependencies
        uses: actions/cache@v5
        with:
          path: ~/.m2/repository
          key: "m2-e2e-${{ hashFiles('bundles/browser/deps.edn') }}-${{ hashFiles('e2e/deps.edn') }}"

      - name: Build browser bundle
        working-directory: ./bundles/browser
        run: |
          npm install
          ./build.sh

      - name: Install e2e dependencies
        working-directory: ./e2e
        run: |
          npm install
          npx playwright install --with-deps chromium

      - name: Run e2e tests
        working-directory: ./e2e
        run: npm test

      - name: Upload traces on failure
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-traces
          path: e2e/test-results/

      - name: Publish Test Report
        uses: mikepenz/action-junit-report@v5
        if: success() || failure()
        with:
          report_paths: "e2e/report.xml"
