name: E2E Tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read
  checks: write
  id-token: write

jobs:
  test:
    runs-on: ubuntu-latest
    # Playwright's chromium needs apt-installable system libraries, so this
    # job runs on the bare runner instead of the Alpine build-image the other
    # suites share.
    steps:
      - uses: actions/checkout@v6

      - name: Cache dependencies
        uses: actions/cache@v5
        with:
          path: ~/.m2/repository
          key: "m2-e2e-${{ hashFiles('bundles/browser/deps.edn') }}-${{ hashFiles('e2e/deps.edn') }}"

      - name: Build browser bundle
        working-directory: ./bundles/browser
        run: |
          npm install
          ./build.sh

      - name: Install e2e dependencies
        working-directory: ./e2e
        run: |
          npm install
          npx playwright install --with-deps chromium

      - name: Run e2e tests
        working-directory: ./e2e
        run: npm test

      - name: Upload traces on failure
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-traces
          path: e2e/test-results/

      - name: Publish Test Report
        uses: mikepenz/action-junit-report@v5
        if: success() || failure()
        with:
          report_paths: "e2e/report.xml"
